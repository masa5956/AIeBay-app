# Render Blueprint: バックエンド(Express)デプロイ用設定
# https://render.com/docs/blueprint-spec
#
# 使い方: Renderダッシュボードで「New +」→「Blueprint」からこのリポジトリを選択すると、
# このファイルを元にWeb Serviceが作成される。sync: false の環境変数はRenderダッシュボード側で
# 手動入力が必要（.env.example を参照）。
services:
  - type: web
    name: ebay-ai-lister-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # publishable/anonキー。POST /api/settings/shipping-address/reveal（住所再表示のパスワード
      # 再認証）専用クライアントに使う。VITE_SUPABASE_ANON_KEYと同じ値でよい。
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: TEXT_AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: GROQ_TEXT_MODEL
        value: llama-3.3-70b-versatile
      # Sandbox/Productionを設定タブから即時切替できるよう環境ごとに分離（ebayAuth.js参照）。
      # 価格調査(/api/estimate-price)はEBAY_PRODUCTION_CLIENT_ID/_SECRETが設定されていないと
      # 常にSandbox(実在庫がほぼ無い)にフォールバックしてしまうため、Production側も必ず設定すること。
      - key: EBAY_SANDBOX_CLIENT_ID
        sync: false
      - key: EBAY_SANDBOX_CLIENT_SECRET
        sync: false
      - key: EBAY_SANDBOX_RU_NAME
        sync: false
      - key: EBAY_PRODUCTION_CLIENT_ID
        sync: false
      - key: EBAY_PRODUCTION_CLIENT_SECRET
        sync: false
      - key: EBAY_PRODUCTION_RU_NAME
        sync: false
      - key: EBAY_LOCATION_ADDRESS_LINE1
        sync: false
      - key: EBAY_LOCATION_CITY
        sync: false
      - key: EBAY_LOCATION_STATE_OR_PROVINCE
        sync: false
      - key: EBAY_LOCATION_POSTAL_CODE
        sync: false
      - key: EBAY_LOCATION_COUNTRY
        sync: false
      - key: EBAY_DELETION_VERIFICATION_TOKEN
        sync: false
      - key: EBAY_DELETION_ENDPOINT_URL
        sync: false
      # ユーザーごとの出荷元住所(個人情報)をDB保存前にAES-256-GCMで暗号化する鍵。
      # `openssl rand -base64 32` で生成。未設定だと住所の保存・取得自体がエラーになる。
      - key: SHIPPING_ADDRESS_ENCRYPTION_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
